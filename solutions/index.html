<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solutions</title>
  <!-- Load styles and fonts up front (render-blocking) so pages never flash unstyled. -->
  <style>html, body { background: #e1d1c9; }</style>
  <link rel="preload" href="../src/fonts/NunitoSans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../src/styles/common.css" />
  <script type="module" src="../src/pages/solutions.js"></script>
</head>
<body>
  <main class="stage solutions">
    <section class="panel sector-panel">
      <h2 class="sector-label" style="color: var(--color-red)">Making things</h2>
      <div class="highway-wrap"><canvas id="highway-making"></canvas></div>
    </section>
    <section class="panel sector-panel">
      <h2 class="sector-label" style="color: var(--color-green)">Food and land</h2>
      <div class="highway-wrap"><canvas id="highway-food"></canvas></div>
    </section>
    <section class="panel sector-panel">
      <h2 class="sector-label" style="color: var(--color-darkbrown)">Getting around</h2>
      <div class="highway-wrap"><canvas id="highway-moving"></canvas></div>
    </section>
    <p class="help">Space start/stop · ←/→ step · ↑/↓ tempo · 1–2 jump</p>
    <div id="overlay" class="overlay">Solutions</div>
    <a class="logo" href="../" title="Back to menu"><img src="../images/dcg-logo.png" alt="Data Culture Group logo (back to menu)" /></a>
  </main>
</body>
</html>
