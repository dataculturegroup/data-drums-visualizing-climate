<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Current Emissions</title>
  <!-- Load styles and fonts up front (render-blocking) so pages never flash unstyled. -->
  <style>html, body { background: #e1d1c9; }</style>
  <link rel="preload" href="../src/fonts/NunitoSans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../src/styles/common.css" />
  <script type="module" src="../src/pages/current-emissions.js"></script>
</head>
<body>
  <main class="stage split">
    <div class="blob" style="--x: -18; --y: -42; --d: 70; --c: var(--color-darkbrown)"></div>
    <section class="panel">
      <header class="track-info">
        <div id="track-year"></div>
      </header>
      <div class="highway-wrap"><canvas id="highway"></canvas></div>
    </section>
    <section class="panel chart-panel">
      <h2>Global CO₂ emissions (billion tonnes / year)</h2>
      <div id="chart" class="chart"></div>
      <p class="help">Space start/stop · ←/→ track · ↑/↓ tempo · 1–7 jump</p>
    </section>
    <div id="overlay" class="overlay">Press Space or click to start</div>
    <a class="logo" href="../" title="Back to menu"><img src="../images/dcg-logo.png" alt="Data Culture Group logo (back to menu)" /></a>
  </main>
</body>
</html>
