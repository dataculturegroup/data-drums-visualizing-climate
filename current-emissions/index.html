<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Current Emissions</title>
  <!-- Load styles and fonts up front (render-blocking) so pages never flash unstyled. -->
  <style>html, body { background: #e1d1c9; }</style>
  <link rel="preload" href="../src/fonts/Teko-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../src/fonts/Montserrat-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../src/styles/common.css" />
  <script type="module" src="../src/pages/current-emissions.js"></script>
</head>
<body>
  <main class="stage split">
    <section class="panel split-side">
      <p id="highway-year" class="highway-title"></p>
      <div class="highway-wrap"><canvas id="highway"></canvas></div>
    </section>
    <section class="panel chart-panel split-main">
      <div id="chart" class="chart"></div>
      <h2>Global CO₂ emissions (billion tonnes / year)</h2>
      <p class="help">Space start/stop · ←/→ track · ↑/↓ tempo · 1–7 jump · M sound on/off</p>
    </section>
    <div id="overlay" class="overlay"><div><span class="movement">Movement 2</span>Current Emissions</div></div>
  </main>
</body>
</html>
