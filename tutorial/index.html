<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Drums Warm Up</title>
  <!-- Load styles and fonts up front (render-blocking) so pages never flash unstyled. -->
  <style>html, body { background: #e1d1c9; }</style>
  <link rel="preload" href="../src/fonts/Teko-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../src/fonts/Montserrat-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../src/styles/common.css" />
  <script type="module" src="../src/pages/tutorial.js"></script>
</head>
<body>
  <main class="stage tutorial">
    <div class="blob blob-you" style="--x: -20; --y: 15; --d: 70; --c: var(--color-green)"></div>
    <div class="blob blob-me" style="--x: 127.8; --y: 15; --d: 70; --c: var(--color-red)"></div>
    <section class="panel cue-label you-label">
      <div id="cue-you" class="cue">YOU</div>
    </section>
    <section class="panel highway-panel you-highway">
      <div class="highway-wrap"><canvas id="highway-you"></canvas></div>
    </section>
    <section class="panel highway-panel me-highway">
      <div class="highway-wrap"><canvas id="highway-me"></canvas></div>
    </section>
    <section class="panel cue-label me-label">
      <div id="cue-me" class="cue">ME</div>
      <p class="help">Space start/stop · ←/→ step · ↑/↓ tempo · 1–4 jump</p>
    </section>
    <div id="overlay" class="overlay">Warm up</div>
    <a class="logo" href="../" title="Back to menu"><img src="../images/dcg-logo.png" alt="Data Culture Group logo (back to menu)" /></a>
  </main>
</body>
</html>
